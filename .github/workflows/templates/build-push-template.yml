name: Build and Push User Services

description: Template for building and pushing all user services to DockerHub.

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push user-add service
      uses: docker/build-push-action@v5
      with:
        context: ./user-add
        file: ./user-add/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-add:latest
        build-args: |
          ENV=local

    - name: Build and push user-list service
      uses: docker/build-push-action@v5
      with:
        context: ./user-list
        file: ./user-list/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-list:latest
        build-args: |
          ENV=local

    - name: Build and push user-delete service
      uses: docker/build-push-action@v5
      with:
        context: ./user-delete
        file: ./user-delete/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-delete:latest
        build-args: |
          ENV=local

    - name: Build and push user-update service
      uses: docker/build-push-action@v5
      with:
        context: ./user-update
        file: ./user-update/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-update:latest
        build-args: |
          ENV=local
