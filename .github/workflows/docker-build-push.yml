name: Build and Push User Services

on:
  push:
    branches:
      - main
      - phase-1
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ORGS: uc-orgs 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push user-add service
        uses: docker/build-push-action@v5
        with:
          context: ./user-add
          file: ./user-add/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.ORGS }}/user-add:latest
          build-args: |
            ENV=local

      - name: Build and push user-list service
        uses: docker/build-push-action@v5
        with:
          context: ./user-list
          file: ./user-list/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.ORGS }}/user-list:latest
          build-args: |
            ENV=local

      - name: Build and push user-delete service
        uses: docker/build-push-action@v5
        with:
          context: ./user-delete
          file: ./user-delete/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.ORGS }}/user-delete:latest
          build-args: |
            ENV=local

      - name: Build and push user-update service
        uses: docker/build-push-action@v5
        with:
          context: ./user-update
          file: ./user-update/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.ORGS }}/user-update:latest
          build-args: |
            ENV=local
